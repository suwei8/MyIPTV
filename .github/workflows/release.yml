name: Trigger Dist Build

# 构建/发布已迁移到公开分发仓库 suwei8/MyIPTV-dist。
# 本 workflow 只负责在打 tag 时通知 dist 仓库去构建, APK 产物发布在 MyIPTV-dist。
# 需在 MyIPTV 仓库配置 secret: DIST_DISPATCH_TOKEN (对 MyIPTV-dist 有 contents:write 权限的 PAT)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号 (如 v1.1.15)'
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: 通知 MyIPTV-dist 构建
        env:
          DIST_TOKEN: ${{ secrets.DIST_DISPATCH_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -z "$DIST_TOKEN" ]; then
            echo "::warning::未配置 secrets.DIST_DISPATCH_TOKEN, 跳过自动构建。"
            echo "请在 MyIPTV 仓库 Settings → Secrets and variables → Actions 添加 DIST_DISPATCH_TOKEN"
            echo "(对 MyIPTV-dist 有 contents:write 的 PAT), 或到 MyIPTV-dist 仓库手动 Run workflow。"
            exit 0
          fi
          curl -sSf -X POST \
            -H "Authorization: Bearer $DIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/suwei8/MyIPTV-dist/dispatches \
            -d "{\"event_type\":\"myiptv-release\",\"client_payload\":{\"tag\":\"${TAG}\"}}"
          echo "已通知 MyIPTV-dist 构建版本: ${TAG}"
